<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FacOps">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#D5DBE3">
  <title>FacOps map preview</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #D5DBE3; overflow: hidden; }
    body {
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #game { display: block; width: 100%; height: 100%; }
    /* Overlays (spec 6.7): plain HTML over the canvas, one at a time. The game pauses while one is open. */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: rgba(213, 219, 227, 0.72); touch-action: manipulation;
    }
    #overlay[hidden] { display: none; }
    .card {
      box-sizing: border-box; max-width: min(440px, 92vw); max-height: 92vh; overflow: auto;
      background: #FFFFFF; border: 1px solid #C9D1DB; border-radius: 8px; padding: 16px 22px;
      color: #1F3A5F; text-align: center;
    }
    .card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .card p { margin: 6px 0; font-size: 14px; }
    .card .muted { color: #56606E; font-size: 13px; }
    .card .big { display: flex; gap: 28px; justify-content: center; margin: 8px 0 4px; }
    .card .big b { display: block; font-size: 26px; font-weight: 700; }
    .card .big span { color: #56606E; font-size: 12px; }
    .card .new { font-weight: 700; color: #1F3A5F; }
    .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .buttons button {
      min-width: 110px; min-height: 44px; padding: 0 18px; border-radius: 8px; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif;
      border: 1px solid #1F3A5F; background: #FFFFFF; color: #1F3A5F; cursor: pointer;
    }
    .buttons button.primary { background: #1F3A5F; color: #FFFFFF; }
    /* Tuning drawer: two columns of controls on a wide phone, one on a narrow window. Each row is 44 px tall. */
    .card.tuning { width: min(680px, 98vw); max-width: none; max-height: 97vh; padding: 6px 14px 8px; }
    .card.tuning h1 { font-size: 16px; margin: 0; }
    .card.tuning p.muted { margin: 0 0 2px; font-size: 12px; }
    .card.tuning .buttons { margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(275px, 1fr)); column-gap: 16px; text-align: left; }
    .row { display: grid; grid-template-columns: 1fr 104px 34px; align-items: center; min-height: 44px; font-size: 12px; gap: 6px; }
    .row input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: #1F3A5F; }
    .row input[type=checkbox] { width: 22px; height: 22px; margin: 0; justify-self: start; accent-color: #1F3A5F; }
    .row output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    label.row { cursor: pointer; }
    /* Round-over results: headline numbers, then a two-column list. Sized to fit 660 x 300. */
    .card.results { width: min(680px, 98vw); max-width: none; max-height: 97vh; padding: 8px 16px 10px; }
    .card.results h1 { font-size: 18px; margin: 0; }
    .card.results .big { margin: 4px 0 2px; gap: 36px; }
    .card.results .big b { font-size: 24px; }
    .card.results p { margin: 4px 0 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); column-gap: 18px; margin: 4px 0 0; text-align: left; font-size: 12px; }
    .stats div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px solid #EEF1F5; }
    .stats dt { color: #56606E; }
    .stats dd { margin: 0; text-align: right; font-weight: 600; }
    .card.results .buttons { margin-top: 8px; }
    #results-text { width: 100%; height: 60px; margin-top: 6px; font: 11px ui-monospace, monospace; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    /* Spec 6.7: shown whenever the page is taller than it is wide, over everything else. */
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #D5DBE3; z-index: 10; }
    #rotate p { color: #1F3A5F; font-size: 20px; font-weight: 600; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate"><p>Turn your phone sideways</p></div>
  <script type="module" src="./src/preview.js"></script>
</body>
</html>
