<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FacOps">
  <meta name="theme-color" content="#D5DBE3">
  <title>FacOps</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #D5DBE3; overflow: hidden; }
    body {
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #game { display: block; width: 100%; height: 100%; }
    /* Overlays (spec 6.7): plain HTML over the canvas, one at a time. The game pauses while one is open. */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: rgba(213, 219, 227, 0.72); touch-action: manipulation;
    }
    #overlay[hidden] { display: none; }
    .card {
      box-sizing: border-box; max-width: min(440px, 92vw); max-height: 92vh; overflow: auto;
      background: #FFFFFF; border: 1px solid #C9D1DB; border-radius: 8px; padding: 16px 22px;
      color: #1F3A5F; text-align: center;
    }
    .card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .card p { margin: 6px 0; font-size: 14px; }
    .card .muted { color: #56606E; font-size: 13px; }
    .card .big { display: flex; gap: 28px; justify-content: center; margin: 8px 0 4px; }
    .card .big b { display: block; font-size: 26px; font-weight: 700; }
    .card .big span { color: #56606E; font-size: 12px; }
    .card .new { font-weight: 700; color: #1F3A5F; }
    .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .buttons button {
      min-width: 110px; min-height: 44px; padding: 0 18px; border-radius: 8px; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif;
      border: 1px solid #1F3A5F; background: #FFFFFF; color: #1F3A5F; cursor: pointer;
    }
    .buttons button.primary { background: #1F3A5F; color: #FFFFFF; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay" hidden>
    <div class="card" data-overlay="start" hidden>
      <h1>FacOps</h1>
      <p>Alarms pile up. Send your crew. Keep the load in the green.</p>
      <p class="muted">Best: <span data-field="best"></span></p>
      <div class="buttons"><button class="primary" data-action="start">Start</button></div>
    </div>
    <div class="card" data-overlay="paused" hidden>
      <h1>Paused</h1>
      <div class="buttons">
        <button class="primary" data-action="resume">Resume</button>
        <button data-action="restart">Restart</button>
      </div>
    </div>
    <div class="card" data-overlay="over" hidden>
      <h1>Round over</h1>
      <div class="big">
        <div><b data-field="time"></b><span>survived</span></div>
        <div><b data-field="energy"></b><span>delivered</span></div>
      </div>
      <p data-field="bestLine"></p>
      <div class="buttons"><button class="primary" data-action="again">Play again</button></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
