<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FacOps">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#D5DBE3">
  <title>FacOps</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #D5DBE3; overflow: hidden; }
    body {
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #game { display: block; width: 100%; height: 100%; }
    /* Overlays (spec 6.7): plain HTML over the canvas, one at a time. The game pauses while one is open. */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: rgba(213, 219, 227, 0.72); touch-action: manipulation;
    }
    #overlay[hidden] { display: none; }
    .card {
      box-sizing: border-box; max-width: min(440px, 92vw); max-height: 92vh; overflow: auto;
      background: #FFFFFF; border: 1px solid #C9D1DB; border-radius: 8px; padding: 16px 22px;
      color: #1F3A5F; text-align: center;
    }
    .card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
    .card p { margin: 6px 0; font-size: 14px; }
    .card .muted { color: #56606E; font-size: 13px; }
    .card .big { display: flex; gap: 28px; justify-content: center; margin: 8px 0 4px; }
    .card .big b { display: block; font-size: 26px; font-weight: 700; }
    .card .big span { color: #56606E; font-size: 12px; }
    .card .new { font-weight: 700; color: #1F3A5F; }
    .card .quote { margin: -6px 0 10px; font-style: italic; color: #1F3A5F; }
    .card a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 8px; color: #1F3A5F; font-weight: 600; }
    .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .buttons.sell { margin-top: 8px; }
    .buttons button:disabled { opacity: 0.45; cursor: default; }
    .buttons button {
      min-width: 110px; min-height: 44px; padding: 0 18px; border-radius: 8px; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif;
      border: 1px solid #1F3A5F; background: #FFFFFF; color: #1F3A5F; cursor: pointer;
    }
    .buttons button.primary { background: #1F3A5F; color: #FFFFFF; }
    /* Pass 6 (M37): the blueprint look for the main menu, Settings and the pause menu. Ink sheet,
       a 20 px drafting grid, white and pale blue lines. No hat colours. */
    .card.bp {
      background-color: #1F3A5F; color: #FFFFFF; border: 1px solid #9FB3CC;
      background-image: linear-gradient(#2A4A73 1px, transparent 1px), linear-gradient(90deg, #2A4A73 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .card.bp h1 { color: #FFFFFF; font-weight: 600; letter-spacing: 1px; }
    .card.bp .muted, .card.bp p.muted { color: #9FB3CC; }
    .card.bp .buttons button, .card.bp .bp-link {
      background: transparent; color: #FFFFFF; border: 1px solid #9FB3CC; border-radius: 8px;
    }
    .card.bp .buttons button.primary { background: #FFFFFF; color: #1F3A5F; border-color: #FFFFFF; }
    .card.bp .bp-link { display: inline-flex; align-items: center; justify-content: center; min-width: 110px; min-height: 44px; line-height: normal; padding: 0 18px; box-sizing: border-box; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; text-decoration: none; }
    .card.bp.full {
      position: fixed; inset: 0; max-width: none; max-height: none; border: 0; border-radius: 0; overflow: hidden;
      display: flex; align-items: center; gap: 5vw; text-align: left; box-sizing: border-box;
      padding: max(14px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
    }
    .card.bp.full[hidden] { display: none; }
    /* Settings and the drawer opened from the main menu keep the blueprint sheet behind them. */
    #overlay.bp-backdrop {
      background-color: #1F3A5F;
      background-image: linear-gradient(#2A4A73 1px, transparent 1px), linear-gradient(90deg, #2A4A73 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .bp-title { flex: 1.3; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .bp-dwg { font-size: clamp(10px, 1.5vw, 13px); letter-spacing: 2px; color: #9FB3CC; }
    .bp-name { font-size: clamp(40px, 10vw, 92px); font-weight: 700; letter-spacing: 3px; line-height: 1; }
    .bp-halls { width: clamp(150px, 30vw, 320px); height: auto; }
    .bp-tag { font-size: clamp(12px, 1.8vw, 17px); color: #9FB3CC; }
    .bp-menu { flex: 1; display: flex; flex-direction: column; gap: 10px; max-width: 300px; min-width: 0; }
    .bp-menu button {
      min-height: 44px; padding: 0 16px; border-radius: 8px; text-align: left; cursor: pointer;
      font: 600 16px system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: transparent; color: #FFFFFF; border: 1px solid #9FB3CC;
    }
    .bp-menu button.primary { background: #FFFFFF; color: #1F3A5F; border-color: #FFFFFF; }
    .bp-best { margin: 2px 0 0; font-size: 13px; color: #9FB3CC; }
    .bp-switch { display: flex; align-items: center; gap: 12px; min-height: 44px; text-align: left; cursor: pointer; margin: 8px 0; }
    .bp-switch input { width: 22px; height: 22px; margin: 0; accent-color: #FFFFFF; flex: none; }
    .bp-switch span { display: flex; flex-direction: column; font-size: 15px; font-weight: 600; }
    .bp-switch small { font-size: 12px; font-weight: 400; color: #9FB3CC; }
    /* Tuning drawer: two columns of controls on a wide phone, one on a narrow window. Each row is 44 px tall. */
    .card.tuning { width: min(680px, 98vw); max-width: none; max-height: 97vh; padding: 6px 14px 8px; }
    .card.tuning h1 { font-size: 16px; margin: 0; }
    .card.tuning p.muted { margin: 0 0 2px; font-size: 12px; }
    .card.tuning .buttons { margin-top: 6px; position: sticky; bottom: -8px; background: #FFFFFF; padding: 4px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(275px, 1fr)); column-gap: 16px; text-align: left; }
    .row { display: grid; grid-template-columns: 1fr 104px 34px; align-items: center; min-height: 44px; font-size: 12px; gap: 6px; }
    .row input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: #1F3A5F; }
    .row input[type=checkbox] { width: 22px; height: 22px; margin: 0; justify-self: start; accent-color: #1F3A5F; }
    .row output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    label.row { cursor: pointer; }
    /* Round-over results: headline numbers, then a two-column list. Sized to fit 660 x 300. */
    .card.results { width: min(680px, 98vw); max-width: none; max-height: 97vh; padding: 8px 16px 10px; }
    .card.results h1 { font-size: 18px; margin: 0; }
    .card.results .big { margin: 4px 0 2px; gap: 36px; }
    .card.results .big b { font-size: 24px; }
    .card.results p { margin: 4px 0 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); column-gap: 18px; margin: 4px 0 0; text-align: left; font-size: 12px; }
    .stats div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px solid #EEF1F5; }
    .stats dt { color: #56606E; }
    .stats dd { margin: 0; text-align: right; font-weight: 600; }
    .card.results .buttons { margin-top: 8px; }
    #results-text { width: 100%; height: 60px; margin-top: 6px; font: 11px ui-monospace, monospace; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    /* Pass 2 Delivery card (spec 7.4): up to three choices side by side, each a big button. */
    .card.delivery { width: min(620px, 98vw); max-width: none; max-height: 97vh; padding: 10px 16px 12px; }
    .card.delivery h1 { font-size: 20px; margin: 0; }
    .card.delivery p { margin: 4px 0; }
    .card.delivery p:empty { display: none; }
    .choices { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
    .choices:empty { display: none; }
    #delivery-continue[hidden] { display: none; } /* .buttons sets display: flex, which would beat [hidden] */
    .choices button {
      flex: 1 1 0; max-width: 190px; min-height: 44px; padding: 8px 6px; border-radius: 8px; cursor: pointer;
      border: 1px solid #1F3A5F; background: #FFFFFF; color: #1F3A5F; font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .choices canvas { width: 44px; height: 44px; }
    /* Pass 4 hire and upgrade card (M26): four hires, then three upgrades, in a compact grid. */
    .card.shop { padding: 6px 14px 8px; }
    .card.shop h1 { font-size: 17px; }
    .card.shop p { margin: 1px 0 2px; font-size: 12px; }
    .card.shop .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
    .card.shop .choices button { max-width: none; padding: 4px; gap: 1px; }
    .card.shop .choices canvas { width: 26px; height: 26px; }
    .card.shop .choices strong { font-size: 12px; }
    .card.shop .choices span { font-size: 11px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card.shop .choices em { font-style: normal; font-weight: 700; font-size: 12px; }
    /* Pass 5 (M35): what each trade is faster at, the suggested trade, and the recommended crew. */
    .card.shop .choices span.role { white-space: normal; font-size: 10px; line-height: 1.15; color: #56606E; }
    .card.shop .choices b.suggested { font-size: 10px; font-weight: 700; color: #FFFFFF; background: #1F3A5F; border-radius: 6px; padding: 0 5px; }
    .card.shop .crew.short { background: #D99A1C; color: #1F3A5F; font-weight: 700; border-radius: 6px; padding: 0 5px; } /* the yellow band colour */
    .card.shop .choices button:disabled { opacity: 0.45; cursor: default; }
    .card.shop .buttons { margin-top: 4px; }
    .choices strong { font-size: 14px; }
    .choices span { color: #56606E; font-size: 12px; }
    /* Spec 6.7: shown whenever the page is taller than it is wide, over everything else. */
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #D5DBE3; z-index: 10; }
    #rotate p { color: #1F3A5F; font-size: 20px; font-weight: 600; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay" hidden>
    <!-- Pass 6 (M37): the main menu, a blueprint sheet across the whole screen. -->
    <div class="card bp full" data-overlay="menu" hidden>
      <div class="bp-title">
        <span class="bp-dwg">DWG FO-001 · REV 6</span>
        <span class="bp-name">FacOps</span>
        <svg class="bp-halls" viewBox="0 0 200 26" aria-hidden="true">
          <rect x="1" y="4" width="34" height="18" fill="none" stroke="#FFFFFF" stroke-width="1"/>
          <rect x="45" y="4" width="34" height="18" fill="none" stroke="#FFFFFF" stroke-width="1"/>
          <rect x="89" y="4" width="34" height="18" fill="none" stroke="#FFFFFF" stroke-width="1"/>
          <rect x="133" y="4" width="34" height="18" fill="none" stroke="#FFFFFF" stroke-width="1"/>
          <line x1="0" y1="13" x2="200" y2="13" stroke="#9FB3CC" stroke-width="1" stroke-dasharray="3 3"/>
        </svg>
        <span class="bp-tag">Facility operations manager wanted</span>
      </div>
      <div class="bp-menu">
        <button class="primary" data-action="start">New run</button>
        <button data-action="tutorial">Tutorial</button>
        <button data-action="settings">Settings</button>
        <p class="bp-best">Best: <span data-field="best"></span></p>
      </div>
    </div>
    <div class="card bp" data-overlay="settings" hidden>
      <h1>Settings</h1>
      <label class="bp-switch"><input type="checkbox" id="classic-switch"><span>Classic mode<small>The dispatch game of passes 1 to 3. From the next run.</small></span></label>
      <div class="buttons">
        <a class="bp-link" href="./pass1/">Pass 1</a>
        <a class="bp-link" href="./map.html">Map preview</a>
        <button data-action="tuning">Tuning</button>
        <button class="primary" data-action="settingsBack">Back</button>
      </div>
    </div>
    <div class="card bp" data-overlay="paused" hidden>
      <h1>Paused</h1>
      <div class="buttons">
        <button class="primary" data-action="resume">Resume</button>
        <button data-action="restart">Restart</button>
        <button data-action="settings">Settings</button>
      </div>
      <div class="buttons sell" id="sell-row" hidden>
        <button data-action="sellAsk" id="sell-button">Hand over the keys</button>
      </div>
      <p class="muted" data-field="sellWhy" hidden></p>
    </div>
    <div class="card" data-overlay="sell" hidden>
      <h1 data-field="title">Hand over the keys?</h1>
      <p data-field="price"></p>
      <p data-field="score"></p>
      <p class="muted" data-field="note"></p>
      <div class="buttons">
        <button data-action="back">Back</button>
        <button class="primary" data-action="sell">Sell</button>
      </div>
    </div>
    <div class="card" data-overlay="commissioned" hidden>
      <h1 data-field="title">Commissioned</h1>
      <p class="quote" data-field="quote"></p>
      <p data-field="price"></p>
      <div class="buttons">
        <button data-action="keep">Keep running</button>
        <button class="primary" data-action="sell" data-field="sell">Hand over the keys</button>
      </div>
    </div>
    <div class="card results" data-overlay="over" hidden>
      <h1>Round over</h1>
      <p class="quote" data-field="quote" hidden></p>
      <div class="big" id="results-big"></div>
      <dl class="stats" id="results-lines"></dl>
      <p class="new" data-field="bestLine"></p>
      <textarea id="results-text" readonly hidden aria-label="Results to copy"></textarea>
      <div class="buttons">
        <button data-action="copy" id="copy-button">Copy results</button>
        <button class="primary" data-action="again">Play again</button>
        <button data-action="tuning">Tuning</button>
      </div>
    </div>
    <div class="card delivery" data-overlay="delivery" hidden>
      <h1 data-field="title"></h1>
      <p data-field="plantB"></p>
      <p data-field="joined"></p>
      <p class="muted" data-field="prompt"></p>
      <div class="choices" id="delivery-choices"></div>
      <div class="buttons" id="delivery-continue"><button class="primary" data-action="continue">Continue</button></div>
    </div>
    <div class="card delivery shop" data-overlay="shop" hidden>
      <h1 data-field="title">Hire and upgrade</h1>
      <p class="muted"><span data-field="crew" class="crew"></span> · <span data-field="cash"></span></p>
      <div class="choices" id="shop-choices"></div>
      <div class="buttons"><button class="primary" data-action="continue">Close</button></div>
    </div>
    <div class="card tuning" data-overlay="tuning" hidden>
      <h1>Tuning</h1>
      <p class="muted">Changes apply from the next round.</p>
      <div class="grid" id="tuning-controls"></div>
      <div class="buttons">
        <button data-action="reset">Reset to defaults</button>
        <button class="primary" data-action="done">Done</button>
      </div>
    </div>
  </div>
  <div id="rotate"><p>Turn your phone sideways</p></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
